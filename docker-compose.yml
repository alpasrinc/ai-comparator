services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ai_comparator
      MYSQL_USER: ai_comparator_app
      MYSQL_PASSWORD: ${AI_COMPARATOR_DB_PASSWORD:?AI_COMPARATOR_DB_PASSWORD gerekli}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_comparator?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul
      AI_COMPARATOR_DB_PASSWORD: ${AI_COMPARATOR_DB_PASSWORD:?AI_COMPARATOR_DB_PASSWORD gerekli}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY gerekli}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY gerekli}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY gerekli}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
