spring.application.name=ai-comparator-backend

spring.datasource.url=jdbc:mysql://localhost:3306/ai_comparator?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul
spring.datasource.username=ai_comparator_app
spring.datasource.password=${AI_COMPARATOR_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

ai.request-timeout-seconds=${AI_REQUEST_TIMEOUT_SECONDS:30}
ai.synthesis-timeout-seconds=${AI_SYNTHESIS_TIMEOUT_SECONDS:90}

ai.rate-limit.capacity=${AI_RATE_LIMIT_CAPACITY:20}
ai.rate-limit.refill-interval-seconds=${AI_RATE_LIMIT_REFILL_INTERVAL_SECONDS:3}

openai.model=${OPENAI_MODEL:gpt-5.6-luna}
openai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:2048}
openai.synthesis-max-output-tokens=${OPENAI_SYNTHESIS_MAX_OUTPUT_TOKENS:4096}

anthropic.model=${ANTHROPIC_MODEL:claude-haiku-4-5}
anthropic.max-output-tokens=${ANTHROPIC_MAX_OUTPUT_TOKENS:2048}
anthropic.synthesis-max-output-tokens=${ANTHROPIC_SYNTHESIS_MAX_OUTPUT_TOKENS:4096}
# Prompt cache TTL: 5m (varsayilan) veya 1h.
anthropic.cache.ttl=${ANTHROPIC_CACHE_TTL:5m}

gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:2048}
gemini.synthesis-max-output-tokens=${GEMINI_SYNTHESIS_MAX_OUTPUT_TOKENS:4096}
