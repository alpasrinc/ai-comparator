spring.application.name=ai-comparator-backend

spring.datasource.url=jdbc:mysql://localhost:3306/ai_comparator?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul
spring.datasource.username=ai_comparator_app
spring.datasource.password=${AI_COMPARATOR_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

ai.request-timeout-seconds=${AI_REQUEST_TIMEOUT_SECONDS:30}

openai.model=${OPENAI_MODEL:gpt-5.6-luna}

anthropic.model=${ANTHROPIC_MODEL:claude-haiku-4-5}
anthropic.max-output-tokens=${ANTHROPIC_MAX_OUTPUT_TOKENS:1024}

gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:1024}
